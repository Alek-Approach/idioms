<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idiom Match — Weeks 2–5</title>
<meta name="description" content="Match English idioms to their meanings. Sports, politics and media, business, body and emotions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E9E2;
    --card:#FCFCF8;
    --ink:#14161A;
    --ink-soft:#5C626B;
    --accent:#1F5DDA;
    --shadow:3px 3px 0 var(--ink);
    --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
    --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"Spline Sans Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    background-image:radial-gradient(rgba(20,22,26,.07) 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;
    line-height:1.5;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 120px}

  /* ---------- masthead ---------- */
  .eyebrow{
    font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 14px;
  }
  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(2.1rem,7vw,4rem);line-height:.95;letter-spacing:-.035em;
    margin:0 0 14px;max-width:14ch;
  }
  h1 .cut{display:inline-block;position:relative}
  h1 .cut::after{
    content:"";position:absolute;left:0;right:0;bottom:.1em;height:.09em;background:var(--accent);
    transition:background .3s ease;
  }
  .lede{margin:0;max-width:52ch;color:var(--ink-soft);font-size:1.02rem}

  /* ---------- week tabs ---------- */
  .weeks{
    display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 22px;
    border-top:2px solid var(--ink);padding-top:22px;
  }
  .tab{
    font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.02em;
    background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:4px;
    padding:9px 13px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, color .12s ease;
  }
  .tab .wk{display:block;font-size:.66rem;opacity:.6;letter-spacing:.12em;text-transform:uppercase}
  .tab:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .tab[aria-selected="true"]{background:var(--tabcolor);color:#fff;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .tab[aria-selected="true"] .wk{opacity:.75}
  .tab .done{display:none}
  .tab.complete .done{display:inline}

  /* ---------- status ---------- */
  .status{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px;
    border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px;
  }
  .status h2{
    font-family:var(--display);font-weight:600;font-size:1.35rem;letter-spacing:-.02em;margin:0;
  }
  .rounds{display:flex;gap:6px}
  .round-chip{
    font-family:var(--mono);font-size:.7rem;font-weight:600;
    border:2px solid var(--ink);background:var(--card);border-radius:999px;
    padding:2px 10px;cursor:pointer;
  }
  .round-chip[aria-current="true"]{background:var(--accent);color:#fff}
  .score{margin-left:auto;font-family:var(--mono);font-size:.76rem;color:var(--ink-soft)}
  .score b{color:var(--ink)}

  /* ---------- board ---------- */
  .board{display:grid;grid-template-columns:1fr 1.35fr;gap:18px;align-items:start}
  .col-label{
    font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 10px;
  }
  .stack{display:flex;flex-direction:column;gap:10px}

  .card{
    display:block;width:100%;text-align:left;font-family:inherit;
    background:var(--card);color:var(--ink);
    border:2px solid var(--ink);border-radius:5px;
    padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, color .12s ease;
  }
  .card.idiom{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:-.015em}
  .card.meaning{font-size:.95rem;line-height:1.42}
  .card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--accent)}
  .card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .card.selected{background:var(--accent);color:#fff;transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .card.wrong{animation:shake .38s ease;border-color:#C01E2E;background:#FBE9EA}
  .card.gone{animation:snap .34s ease forwards;pointer-events:none}

  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
  }
  @keyframes snap{
    0%{opacity:1;transform:scale(1)}
    45%{transform:scale(1.03)}
    100%{opacity:0;transform:scale(.9);height:0;padding-top:0;padding-bottom:0;margin-top:-10px;border-width:0}
  }

  /* ---------- locked pairs (the signature) ---------- */
  .locked{margin-top:34px;border-top:2px solid var(--ink);padding-top:18px}
  .locked h2{
    font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;margin:0 0 12px;
  }
  .pairs{display:flex;flex-direction:column;gap:9px}
  .pair{
    display:flex;align-items:stretch;border:2px solid var(--ink);border-radius:5px;
    overflow:hidden;box-shadow:var(--shadow);background:var(--card);
    animation:lock .3s ease;
  }
  @keyframes lock{from{opacity:0;transform:translateY(-8px) scaleX(.96)}to{opacity:1;transform:none}}
  .pair .half-a{
    background:var(--accent);color:#fff;padding:11px 15px;
    font-family:var(--display);font-weight:600;font-size:.98rem;letter-spacing:-.015em;
    flex:0 0 34%;display:flex;align-items:center;
  }
  .pair .joint{position:relative;width:0;border-left:2px dashed var(--ink)}
  .pair .joint::before{
    content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;
    width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);
  }
  .pair .half-b{padding:11px 15px 11px 22px;font-size:.93rem;display:flex;align-items:center;flex:1}
  .empty{font-size:.9rem;color:var(--ink-soft);font-style:italic}

  /* ---------- round complete ---------- */
  .done-panel{
    border:2px solid var(--ink);border-radius:5px;background:var(--card);
    box-shadow:6px 6px 0 var(--accent);padding:22px;margin-bottom:22px;
    animation:lock .35s ease;
  }
  .done-panel h3{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.03em;margin:0 0 6px}
  .done-panel p{margin:0 0 16px;color:var(--ink-soft)}
  .done-panel .figures{display:flex;gap:26px;margin:0 0 18px;font-family:var(--mono)}
  .figure b{display:block;font-size:1.7rem;font-family:var(--display);font-weight:800;line-height:1}
  .figure span{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}

  .btn{
    font-family:var(--mono);font-size:.78rem;font-weight:600;
    background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:4px;
    padding:9px 15px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--accent)}
  .btn.ghost{background:var(--card);color:var(--ink)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}

  footer{
    margin-top:40px;border-top:2px solid var(--ink);padding-top:14px;
    font-family:var(--mono);font-size:.7rem;color:var(--ink-soft);letter-spacing:.04em;
  }

  /* ---------- selection bar (mobile) ---------- */
  .selbar{
    display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--accent);color:#fff;border-top:2px solid var(--ink);
    padding:11px 16px;align-items:center;gap:12px;
  }
  .selbar p{margin:0;font-size:.86rem;line-height:1.3;flex:1}
  .selbar p b{font-family:var(--display)}
  .selbar button{
    background:transparent;border:2px solid #fff;color:#fff;border-radius:4px;
    font-family:var(--mono);font-size:.7rem;padding:5px 9px;cursor:pointer;
  }

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:760px){
    .board{grid-template-columns:1fr;gap:26px}
    .pair{flex-direction:column}
    .pair .half-a{flex:none}
    .pair .joint{width:auto;height:0;border-left:0;border-top:2px dashed var(--ink)}
    .pair .joint::before{left:50%;margin-left:-6px;top:-7px;margin-top:0}
    .pair .half-b{padding:14px 15px}
    .selbar.on{display:flex}
    body.has-selection .wrap{padding-bottom:150px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
    .card.gone{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">English idioms · weeks 2–5</p>
    <h1>Match the <span class="cut">idiom</span> to its meaning.</h1>
    <p class="lede">Choose an idiom, then choose the meaning that belongs to it. Correct pairs lock together and drop below the board.</p>
  </header>

  <nav class="weeks" id="weeks" role="tablist" aria-label="Idiom sets by week"></nav>

  <main id="panel" role="tabpanel">
    <div class="status">
      <h2 id="setTitle"></h2>
      <div class="rounds" id="rounds"></div>
      <div class="score" id="score"></div>
    </div>

    <div id="donePanel"></div>

    <div class="board" id="board">
      <section>
        <h2 class="col-label">Idioms</h2>
        <div class="stack" id="idioms"></div>
      </section>
      <section>
        <h2 class="col-label">Meanings</h2>
        <div class="stack" id="meanings"></div>
      </section>
    </div>

    <section class="locked">
      <h2>Locked pairs</h2>
      <div class="pairs" id="pairs"></div>
    </section>

    <div class="toolbar">
      <button class="btn ghost" id="reshuffle">Shuffle this round</button>
      <button class="btn ghost" id="restart">Start the week again</button>
    </div>
  </main>

  <footer>Idiom Match · a practice set for weeks 2–5</footer>
</div>

<div class="selbar" id="selbar" aria-hidden="true">
  <p>Selected: <b id="selText"></b> — now pick its meaning.</p>
  <button type="button" id="selClear">Clear</button>
</div>

<p class="sr" id="live" role="status" aria-live="polite"></p>

<script>
const WEEKS = [
  {
    week: 2, name: "Sports", accent: "#1F5DDA",
    pairs: [
      ["a level playing field", "A situation where everyone has an equal and fair chance to succeed."],
      ["hit it out of the park", "To do something extremely well or achieve great success."],
      ["cover all your bases", "To prepare for every possibility and make sure nothing is forgotten."],
      ["a slam dunk", "Something that is almost certain to succeed or be approved."],
      ["a Monday morning quarterback", "Someone who criticizes a decision afterward, when they already know what happened."]
    ]
  },
  {
    week: 3, name: "Politics & Media", accent: "#C81E38",
    pairs: [
      ["spin", "To present information in a way that makes someone or something look better."],
      ["spin doctor", "A person whose job is to present information positively, especially for a politician or organization."],
      ["talking points", "Prepared key ideas or arguments used when speaking about a topic."],
      ["sound bite", "A short, memorable statement, especially one used by the media."],
      ["off the record", "Information said privately that is not supposed to be published or quoted."],
      ["on the record", "Information that can officially be published or quoted."],
      ["take a hard line", "To have a very strict or firm position on an issue."],
      ["toe the line", "To follow the rules or accept the official position of a group or organization."],
      ["read the room", "To understand the mood and reactions of the people around you."],
      ["damage control", "Actions taken to reduce the negative effects of a mistake, scandal, or problem."]
    ]
  },
  {
    week: 4, name: "Business", accent: "#0F7A5A",
    pairs: [
      ["the bottom line", "The most important result or point; in business, it can also mean profit."],
      ["touch base", "To briefly contact someone to exchange information or check progress."],
      ["move the needle", "To make a noticeable or meaningful difference."],
      ["circle back", "To return to a topic or contact someone again later."],
      ["low-hanging fruit", "The easiest opportunities or problems to deal with first."],
      ["bandwidth", "The time, energy, or ability to handle additional work."],
      ["deep dive", "A detailed examination or analysis of a topic."],
      ["ballpark figure", "A rough estimate rather than an exact number."],
      ["run it up the flagpole", "To present an idea to see how people react to it."],
      ["drill down", "To examine something in greater detail."]
    ]
  },
  {
    week: 5, name: "Body & Emotions", accent: "#A81A8E",
    pairs: [
      ["get cold feet", "To become nervous or afraid and reconsider doing something."],
      ["bite off more than you can chew", "To take on more work or responsibility than you can handle."],
      ["keep your chin up", "To stay positive during a difficult situation."],
      ["lose your nerve", "To suddenly become too afraid or nervous to do something."],
      ["a gut feeling", "A strong feeling or instinct that is not based on clear evidence."],
      ["butterflies in your stomach", "A nervous or excited feeling in your stomach."],
      ["with a heavy heart", "While feeling very sad about something."],
      ["get it off your chest", "To talk about something that has been worrying or bothering you."],
      ["give the cold shoulder", "To deliberately ignore someone or behave unfriendly toward them."],
      ["bite your tongue", "To stop yourself from saying something you want to say."]
    ]
  }
];

const ROUND_SIZE = 5;
const $ = id => document.getElementById(id);

/* split each week into rounds of 5 so a column never gets unmanageable */
WEEKS.forEach(w => {
  w.rounds = [];
  for (let i = 0; i < w.pairs.length; i += ROUND_SIZE) {
    w.rounds.push(w.pairs.slice(i, i + ROUND_SIZE).map((p, j) => ({ id: i + j, idiom: p[0], meaning: p[1] })));
  }
  w.complete = new Set();
});

let wi = 0, ri = 0, sel = null, board = null, busy = false;

const shuffle = a => { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; };
const say = t => { $("live").textContent = t; };

function buildRound(keepStats) {
  const items = WEEKS[wi].rounds[ri];
  board = {
    items,
    left: shuffle(items),
    right: shuffle(items),
    matched: [],
    tries: keepStats && board ? board.tries : 0
  };
  sel = null;
  render();
}

function renderTabs() {
  const nav = $("weeks");
  nav.innerHTML = "";
  WEEKS.forEach((w, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (w.complete.size === w.pairs.length ? " complete" : "");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === wi);
    b.style.setProperty("--tabcolor", w.accent);
    b.innerHTML = `<span class="wk">Week ${w.week}</span>${w.name} <span class="done">✓</span>`;
    b.onclick = () => { if (busy) return; wi = i; ri = 0; board = null; buildRound(false); };
    nav.appendChild(b);
  });
}

function render() {
  const w = WEEKS[wi];
  document.documentElement.style.setProperty("--accent", w.accent);
  renderTabs();

  $("setTitle").textContent = `Week ${w.week} · ${w.name}`;

  const rc = $("rounds");
  rc.innerHTML = "";
  if (w.rounds.length > 1) {
    w.rounds.forEach((_, i) => {
      const c = document.createElement("button");
      c.className = "round-chip";
      c.textContent = `Round ${i + 1}`;
      c.setAttribute("aria-current", i === ri);
      c.onclick = () => { if (busy) return; ri = i; board = null; buildRound(false); };
      rc.appendChild(c);
    });
  }

  const total = board.items.length, got = board.matched.length;
  const acc = board.tries ? Math.round((got / board.tries) * 100) : 100;
  $("score").innerHTML = `Matched <b>${got}/${total}</b> · Attempts <b>${board.tries}</b> · Accuracy <b>${acc}%</b>`;

  const L = $("idioms"), R = $("meanings");
  L.innerHTML = ""; R.innerHTML = "";
  board.left.filter(p => !board.matched.includes(p.id)).forEach(p => {
    const b = document.createElement("button");
    b.className = "card idiom" + (sel === p.id ? " selected" : "");
    b.textContent = p.idiom;
    b.dataset.id = p.id;
    b.setAttribute("aria-pressed", sel === p.id);
    b.onclick = () => pickIdiom(p);
    L.appendChild(b);
  });
  board.right.filter(p => !board.matched.includes(p.id)).forEach(p => {
    const b = document.createElement("button");
    b.className = "card meaning";
    b.textContent = p.meaning;
    b.dataset.id = p.id;
    b.onclick = () => pickMeaning(p);
    R.appendChild(b);
  });

  const P = $("pairs");
  P.innerHTML = "";
  if (!board.matched.length) {
    P.innerHTML = '<p class="empty">Nothing locked yet.</p>';
  } else {
    board.matched.forEach(id => {
      const p = board.items.find(x => x.id === id);
      const d = document.createElement("div");
      d.className = "pair";
      d.innerHTML = `<span class="half-a"></span><span class="joint"></span><span class="half-b"></span>`;
      d.querySelector(".half-a").textContent = p.idiom;
      d.querySelector(".half-b").textContent = p.meaning;
      P.appendChild(d);
    });
  }

  $("donePanel").innerHTML = "";
  if (got === total) showDone(acc);

  updateSelbar();
}

function updateSelbar() {
  const bar = $("selbar");
  if (sel === null) {
    bar.classList.remove("on");
    bar.setAttribute("aria-hidden", "true");
    document.body.classList.remove("has-selection");
  } else {
    $("selText").textContent = board.items.find(p => p.id === sel).idiom;
    bar.classList.add("on");
    bar.setAttribute("aria-hidden", "false");
    document.body.classList.add("has-selection");
  }
}

function pickIdiom(p) {
  if (busy) return;
  sel = (sel === p.id) ? null : p.id;
  document.querySelectorAll("#idioms .card").forEach(c => {
    const on = Number(c.dataset.id) === sel;
    c.classList.toggle("selected", on);
    c.setAttribute("aria-pressed", on);
  });
  updateSelbar();
  if (sel !== null) say(`Selected ${p.idiom}. Now choose a meaning.`);
}

function pickMeaning(p) {
  if (busy) return;
  if (sel === null) { say("Choose an idiom first."); flash(document.querySelector(`#meanings .card[data-id="${p.id}"]`)); return; }

  board.tries++;
  const chosen = board.items.find(x => x.id === sel);
  const idiomEl = document.querySelector(`#idioms .card[data-id="${sel}"]`);
  const meaningEl = document.querySelector(`#meanings .card[data-id="${p.id}"]`);

  if (p.id === sel) {
    busy = true;
    say(`Correct. ${chosen.idiom} — ${chosen.meaning}`);
    idiomEl && idiomEl.classList.add("gone");
    meaningEl && meaningEl.classList.add("gone");
    const id = sel; sel = null;
    setTimeout(() => {
      board.matched.push(id);
      WEEKS[wi].complete.add(id);
      busy = false;
      render();
    }, 300);
  } else {
    say(`Not a match. ${chosen.idiom} means something else.`);
    flash(idiomEl); flash(meaningEl);
    sel = null;
    setTimeout(() => { if (!busy) render(); }, 450);
  }
}

function flash(el) {
  if (!el) return;
  el.classList.add("wrong");
  setTimeout(() => el.classList.remove("wrong"), 420);
}

function showDone(acc) {
  const w = WEEKS[wi];
  const lastRound = ri === w.rounds.length - 1;
  const lastWeek = wi === WEEKS.length - 1;
  const p = document.createElement("div");
  p.className = "done-panel";
  p.innerHTML = `
    <h3>Round clear.</h3>
    <p>Every idiom in this round is locked to its meaning.</p>
    <div class="figures">
      <div class="figure"><b>${board.matched.length}</b><span>pairs</span></div>
      <div class="figure"><b>${board.tries}</b><span>attempts</span></div>
      <div class="figure"><b>${acc}%</b><span>accuracy</span></div>
    </div>`;
  const next = document.createElement("button");
  next.className = "btn";
  if (!lastRound) { next.textContent = "Next round →"; next.onclick = () => { ri++; board = null; buildRound(false); scrollTop(); }; }
  else if (!lastWeek) { next.textContent = `Week ${WEEKS[wi + 1].week}: ${WEEKS[wi + 1].name} →`; next.onclick = () => { wi++; ri = 0; board = null; buildRound(false); scrollTop(); }; }
  else { next.textContent = "Play week 2 again"; next.onclick = () => { wi = 0; ri = 0; board = null; buildRound(false); scrollTop(); }; }
  p.appendChild(next);

  const again = document.createElement("button");
  again.className = "btn ghost";
  again.style.marginLeft = "10px";
  again.textContent = "Repeat this round";
  again.onclick = () => buildRound(false);
  p.appendChild(again);

  $("donePanel").appendChild(p);
  say("Round complete.");
}

function scrollTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }

$("reshuffle").onclick = () => { if (!busy) buildRound(false); };
$("restart").onclick = () => { if (busy) return; WEEKS[wi].complete.clear(); ri = 0; board = null; buildRound(false); };
$("selClear").onclick = () => { sel = null; render(); };

document.addEventListener("keydown", e => { if (e.key === "Escape" && sel !== null) { sel = null; render(); } });

buildRound(false);
</script>
</body>
</html>
